name: chat_game_app
description: 小酒馆——好友聊天与游戏的工具app
publish_to: 'none'
version: 1.0.21+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  image_picker: ^1.1.2
  path_provider: 2.1.2
  sqflite: ^2.4.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.3.0
  crypto: ^3.0.3
  open_filex: ^4.5.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  http: ^1.2.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  vibration: ^2.0.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.6

dependency_overrides:
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/data/postal_codes.json
    - assets/data/cocktail_recipes.json
